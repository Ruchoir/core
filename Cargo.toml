# Cargo workspace of the shared Rust crates of Ruchoir. Every crate carries the version of the
# repository, and products read them from its release tag (`tag = "vX.Y.Z"`, ADR 0013 of
# Ruchoir/.github).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/Ruchoir/core"

[workspace.dependencies]
# Identifiers (uuid-rs community project, MIT/Apache-2.0), as in the products.
uuid = { version = "1.26", features = ["v4", "serde"] }
# JSON: the contracts the contract check compares, and the recorded permission catalogue (serde
# community, MIT/Apache-2.0).
serde_json = "1"
