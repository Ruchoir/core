[package]
name = "ruchoir-native"
version.workspace = true
description = "How the Ruchoir desktop's core signs in with Propolis (RFC 8252): discovery of an instance, sign-in by code and PKCE through a loopback redirect, one refresh token per issuer and one access token per product."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Propolis's key set and the PKCE challenge, checked as every product checks them (this repository).
ruchoir-auth = { path = "../ruchoir-auth" }
# The ID token's checks (Frank Denis, France; ISC), pure Rust, as in `ruchoir-auth`.
jwt-simple = { version = "0.15", default-features = false, features = ["pure-rust"] }
# Discovery and the token and revocation endpoints (Sean McArthur and community, MIT/Apache-2.0),
# over rustls with the ring provider, as in `ruchoir-auth`.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
# TLS (rustls project, ISRG Prossimo; MIT/Apache-2.0/ISC) with ring (community, Apache-2.0 AND ISC).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# Documents and the stored grant (serde community project, MIT/Apache-2.0).
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# The per-issuer lock, the loopback listener and its timeout (tokio-rs community, MIT).
tokio = { version = "1.53", features = ["sync", "time", "net", "io-util"] }
# Requests and the authorization response's query (Servo project, MIT/Apache-2.0).
form_urlencoded = "1"
# Random values and storage keys in base64url (marshallpierce/rust-base64, community, MIT/Apache-2.0).
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
# State, nonce and verifier from the operating system (rust-random community, MIT/Apache-2.0).
getrandom = "0.4"

[dev-dependencies]
# The async test runtime (tokio-rs community, MIT).
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net"] }
# A stand-in instance in the tests: the hub's manifest and a Propolis (tokio-rs community, MIT).
axum = "0.8"
